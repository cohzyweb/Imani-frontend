<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Quote Review | Imani Logistics UK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-container">

    <aside class="sidebar">
        <div class="logo"><h2>Imani Logistics UK</h2></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a></li>
            <li class="active"><a href="quotes.html"><i class="fas fa-file-invoice"></i> <span>Quote Requests</span></a></li>
            <li><a href="shipments.html"><i class="fas fa-truck"></i> <span>Shipments</span></a></li>
            <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
            <li><a href="customer-service.html"><i class="fas fa-headset"></i> <span>Customer Service</span></a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
            <li class="logout"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Log Out</span></a></li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="topbar">
            <h1>Review Quote Request
                <span id="liveIndicator" class="live-indicator">
                    <i class="fas fa-circle"></i> Live
                </span>
            </h1>
            <div class="admin-profile"><i class="fas fa-user-circle"></i></div>
        </div>

        <!-- CUSTOMER DETAILS -->
        <section class="table-section">
            <div class="section-header"><h2>Customer Details</h2></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="customerName" readonly>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" id="customerEmail" readonly>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="customerPhone" readonly>
                </div>
                <div class="form-group">
                    <label>Service Required</label>
                    <input type="text" id="shipmentType" readonly>
                </div>
                <div class="form-group">
                    <label>Origin</label>
                    <input type="text" id="origin" readonly>
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" id="destination" readonly>
                </div>
                <div class="form-group full-width">
                    <label>Cargo Description</label>
                    <textarea id="cargo" readonly></textarea>
                </div>
            </div>
        </section>

        <!-- QUESTIONNAIRE -->
        <section class="table-section">
            <div class="section-header"><h2>Moving & Logistics Questionnaire</h2></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Packing Responsibility</label>
                    <input type="text" id="packingResponsibility" readonly>
                </div>
                <div class="form-group">
                    <label>Materials Needed</label>
                    <input type="text" id="materialsNeeded" readonly>
                </div>
                <div class="form-group">
                    <label>Furniture Disassembly</label>
                    <input type="text" id="furnitureDisassembly" readonly>
                </div>
                <div class="form-group full-width">
                    <label>Fragile Items</label>
                    <textarea id="fragileItems" readonly></textarea>
                </div>
                <div class="form-group">
                    <label>Floor Levels</label>
                    <input type="text" id="floorLevels" readonly>
                </div>
                <div class="form-group">
                    <label>Elevator Type</label>
                    <input type="text" id="elevator" readonly>
                </div>
                <div class="form-group">
                    <label>Parking Availability</label>
                    <input type="text" id="parking" readonly>
                </div>
                <div class="form-group">
                    <label>Walking Distance Over 20m</label>
                    <input type="text" id="walkingDistance" readonly>
                </div>
                <div class="form-group full-width">
                    <label>Tight Spaces / Special Access Notes</label>
                    <textarea id="accessIssues" readonly></textarea>
                </div>
                <div class="form-group">
                    <label>Supervisor Present on Move Day</label>
                    <input type="text" id="onSiteSupervisor" readonly>
                </div>
                <div class="form-group">
                    <label>Extra Help Required</label>
                    <input type="text" id="extraHelp" readonly>
                </div>
                <div class="form-group">
                    <label>Appliance Handling Assistance</label>
                    <input type="text" id="applianceHelp" readonly>
                </div>
                <div class="form-group">
                    <label>Estimated Number of Boxes</label>
                    <input type="text" id="boxCount" readonly>
                </div>
                <div class="form-group full-width">
                    <label>Bulky or Oversized Items</label>
                    <textarea id="bulkyItems" readonly></textarea>
                </div>
                <div class="form-group">
                    <label>Preferred Moving Date & Time</label>
                    <input type="text" id="timing" readonly>
                </div>
                <div class="form-group">
                    <label>Storage Needed</label>
                    <input type="text" id="storage" readonly>
                </div>
            </div>
        </section>

        <!-- ADMIN RESPONSE -->
        <section class="table-section">
            <div class="section-header"><h2>Set Pricing & Respond</h2></div>
            <form id="quoteForm" class="form-grid">
                <div class="form-group">
                    <label>Base Price (£)</label>
                    <input type="number" id="base_price" step="0.01" placeholder="Enter base amount">
                </div>
                <div class="form-group">
                    <label>VAT (20%) (£)</label>
                    <input type="number" id="vat_amount" readonly>
                </div>
                <div class="form-group">
                    <label>Total Amount (£)</label>
                    <input type="number" id="total_amount" readonly>
                </div>
                <div class="form-group">
                    <label>Estimated Delivery Time</label>
                    <input type="text" id="estimatedTime" placeholder="e.g. 3–5 working days">
                </div>
                <div class="form-group full-width">
                    <label>Notes to Customer</label>
                    <textarea id="notes" placeholder="Additional information for the client..."></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="pending">Pending</option>
                        <option value="quoted">Quoted</option>
                        <option value="rejected">Rejected</option>
                        <option value="approved">Approved</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Send Quote
                    </button>
                    <button type="button" id="downloadInvoice" class="btn btn-outline" style="margin-left:10px;">
                        <i class="fas fa-file-pdf"></i> Download Invoice
                    </button>
                </div>
            </form>
        </section>

    </main>
</div>

<script type="module" src="protect.js"></script>
<script type="module" src="logout.js"></script>
<script type="module" src="review-quotes.js"></script>

</body>
</html>
